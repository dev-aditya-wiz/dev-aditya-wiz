<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Animated footer">
  <defs>
    <linearGradient id="fBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="waveBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="waveGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86EFAC" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#86EFAC" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="24" fill="url(#fBg)"/>
  <path fill="url(#waveBlue)" d="M0,80 C200,40 400,120 600,70 C800,20 1000,110 1200,60 L1200,260 L0,260 Z">
    <animate attributeName="d" dur="8s" repeatCount="indefinite" values="M0,80 C200,40 400,120 600,70 C800,20 1000,110 1200,60 L1200,260 L0,260 Z;M0,70 C200,120 400,30 600,90 C800,140 1000,40 1200,80 L1200,260 L0,260 Z;M0,80 C200,40 400,120 600,70 C800,20 1000,110 1200,60 L1200,260 L0,260 Z"/>
  </path>
  <path fill="url(#waveGreen)" d="M0,110 C220,70 380,150 620,100 C860,50 1040,140 1200,95 L1200,260 L0,260 Z">
    <animate attributeName="d" dur="10s" repeatCount="indefinite" values="M0,110 C220,70 380,150 620,100 C860,50 1040,140 1200,95 L1200,260 L0,260 Z;M0,100 C220,150 380,60 620,120 C860,170 1040,70 1200,115 L1200,260 L0,260 Z;M0,110 C220,70 380,150 620,100 C860,50 1040,140 1200,95 L1200,260 L0,260 Z"/>
  </path>

  <text x="600" y="150" text-anchor="middle" fill="#F8FAFC" font-size="26" font-weight="700" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" filter="url(#fGlow)">Build. Learn. Improve. Repeat.</text>
  <text x="600" y="186" text-anchor="middle" fill="#86EFAC" font-size="14" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">[YOUR NAME] | [YOUR GITHUB] | Always in motion</text>
  <text x="600" y="220" text-anchor="middle" fill="#38BDF8" font-size="12" letter-spacing="3" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">END OF TRANSMISSION</text>
</svg>
