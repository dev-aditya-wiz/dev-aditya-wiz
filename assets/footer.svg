<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260" fill="none">
<style>
  .flow-slow { stroke-dasharray: 14 22; animation: flow 7s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -108; } }
</style>
<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#A855F7"/>
    <stop offset="55%" stop-color="#6DFF6A"/>
    <stop offset="100%" stop-color="#3ED0E8"/>
  </linearGradient>
  <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#07040E" stop-opacity="0"/>
    <stop offset="45%" stop-color="#3B0764"/>
    <stop offset="100%" stop-color="#5B21B6"/>
  </linearGradient>
  <filter id="textglow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect x="1.25" y="1.25" width="1097.5" height="257.5" rx="22" fill="#07040E"/>
<rect x="1.25" y="1.25" width="1097.5" height="257.5" rx="22" stroke="url(#edge)" stroke-width="1.5"/>
<path d="M0 92 C 180 40, 320 130, 520 86 C 740 38, 900 120, 1100 70 L 1100 260 L 0 260 Z" fill="url(#wave)"/>
<path class="flow-slow" d="M0 120 C 200 70, 360 160, 560 112 C 780 60, 940 150, 1100 100" stroke="#3ED0E8" stroke-width="1.4" fill="none"/>
<text x="550" y="132" text-anchor="middle" fill="#F7F7FB" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" filter="url(#textglow)">Build. Learn. Improve. Repeat.</text>
<text x="550" y="172" text-anchor="middle" fill="#6DFF6A" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Aditya Kumar Sharma  |  dev-aditya-wiz  |  Always in motion</text>
<text x="550" y="208" text-anchor="middle" fill="#3ED0E8" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3.2">END OF TRANSMISSION</text>
</svg>