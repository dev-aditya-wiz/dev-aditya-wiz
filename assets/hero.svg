<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img" aria-label="Animated developer hero">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="45%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="heroStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#86EFAC"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="orbBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#86EFAC" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <filter id="heroGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2563EB" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#heroBg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <rect x="2" y="2" width="1196" height="416" rx="26" fill="none" stroke="url(#heroStroke)" stroke-width="2.5"/>

  <circle cx="180" cy="90" r="140" fill="url(#orbBlue)">
    <animate attributeName="cy" values="90;130;90" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="320" r="160" fill="url(#orbGreen)">
    <animate attributeName="cx" values="1040;980;1040" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="70" r="70" fill="url(#orbBlue)" opacity="0.5">
    <animate attributeName="r" values="60;80;60" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g fill="#38BDF8">
    <circle cx="80" cy="60" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="200" r="1.4"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="50" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="120" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="240" r="1.5"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="90" r="1.7"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="180" r="1.4" fill="#86EFAC"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="320" r="1.5" fill="#86EFAC"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="340" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="0" y="0" width="1200" height="6" fill="#38BDF8" opacity="0.18">
    <animateTransform attributeName="transform" type="translate" values="0 -20; 0 420; 0 -20" dur="7s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="78" text-anchor="middle" fill="#86EFAC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" letter-spacing="6">SYSTEM ONLINE</text>
  <text x="600" y="175" text-anchor="middle" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="2" filter="url(#heroGlow)">[YOUR NAME]</text>
  <text x="600" y="222" text-anchor="middle" fill="#38BDF8" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" letter-spacing="3">[YOUR TITLE]</text>
  <text x="600" y="268" text-anchor="middle" fill="#F8FAFC" opacity="0.85" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="16">Building with intention. Learning without pause. Shipping what matters.</text>

  <g transform="translate(600, 318)">
    <rect x="-290" y="-22" width="180" height="44" rx="22" fill="#000000" stroke="#2563EB" stroke-width="1.5"/>
    <text x="-200" y="6" text-anchor="middle" fill="#86EFAC" font-size="13" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">Developer</text>
    <rect x="-90" y="-22" width="180" height="44" rx="22" fill="#000000" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" fill="#38BDF8" font-size="13" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">Builder</text>
    <rect x="110" y="-22" width="180" height="44" rx="22" fill="#000000" stroke="#86EFAC" stroke-width="1.5"/>
    <text x="200" y="6" text-anchor="middle" fill="#86EFAC" font-size="13" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">Learner</text>
  </g>

  <path d="M0,390 C200,360 400,410 600,380 C800,350 1000,400 1200,370 L1200,420 L0,420 Z" fill="#2563EB" opacity="0.18">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0,390 C200,360 400,410 600,380 C800,350 1000,400 1200,370 L1200,420 L0,420 Z;
              M0,380 C200,410 400,360 600,390 C800,410 1000,350 1200,385 L1200,420 L0,420 Z;
              M0,390 C200,360 400,410 600,380 C800,350 1000,400 1200,370 L1200,420 L0,420 Z"/>
  </path>
  <path d="M0,400 C250,375 450,415 700,390 C950,365 1100,405 1200,385 L1200,420 L0,420 Z" fill="#86EFAC" opacity="0.12">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="M0,400 C250,375 450,415 700,390 C950,365 1100,405 1200,385 L1200,420 L0,420 Z;
              M0,408 C250,390 450,370 700,400 C950,420 1100,375 1200,395 L1200,420 L0,420 Z;
              M0,400 C250,375 450,415 700,390 C950,365 1100,405 1200,385 L1200,420 L0,420 Z"/>
  </path>
</svg>
