<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="100%" role="img" aria-label="Project placeholders">
  <defs>
    <linearGradient id="pFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="340" rx="24" fill="#000000"/>
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="20" y="20" width="340" height="300" rx="18" fill="url(#pFill)" stroke="#2563EB" stroke-width="1.6">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <text x="48" y="64" fill="#86EFAC" font-size="12" letter-spacing="3">PROJECT 01</text>
    <text x="48" y="104" fill="#F8FAFC" font-size="22" font-weight="700">[PROJECT NAME]</text>
    <text x="48" y="140" fill="#38BDF8" font-size="14">[STACK / ROLE]</text>
    <text x="48" y="184" fill="#F8FAFC" opacity="0.8" font-size="14">[SHORT DESCRIPTION]</text>
    <text x="48" y="280" fill="#86EFAC" font-size="13">[PROJECT URL]</text>

    <rect x="380" y="20" width="340" height="300" rx="18" fill="url(#pFill)" stroke="#38BDF8" stroke-width="1.6">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.2s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <text x="408" y="64" fill="#86EFAC" font-size="12" letter-spacing="3">PROJECT 02</text>
    <text x="408" y="104" fill="#F8FAFC" font-size="22" font-weight="700">[PROJECT NAME]</text>
    <text x="408" y="140" fill="#38BDF8" font-size="14">[STACK / ROLE]</text>
    <text x="408" y="184" fill="#F8FAFC" opacity="0.8" font-size="14">[SHORT DESCRIPTION]</text>
    <text x="408" y="280" fill="#86EFAC" font-size="13">[PROJECT URL]</text>

    <rect x="740" y="20" width="340" height="300" rx="18" fill="url(#pFill)" stroke="#86EFAC" stroke-width="1.6">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.2s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="768" y="64" fill="#86EFAC" font-size="12" letter-spacing="3">PROJECT 03</text>
    <text x="768" y="104" fill="#F8FAFC" font-size="22" font-weight="700">[PROJECT NAME]</text>
    <text x="768" y="140" fill="#38BDF8" font-size="14">[STACK / ROLE]</text>
