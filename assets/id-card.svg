<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" fill="none">

<style>
  .glow-a { animation: breathe 7s ease-in-out infinite; }
  .glow-b { animation: breathe 9s ease-in-out infinite reverse; }
  .glow-c { animation: breathe 8.5s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: 0.18 } 50% { opacity: 0.5 } }
  .arrive { animation: arrive 1.15s ease both; }
  @keyframes arrive { from { opacity: 0 } to { opacity: 1 } }
  .blink { animation: blink 1.15s steps(1, end) infinite; }
  @keyframes blink { 0%, 46% { opacity: 1 } 50%, 100% { opacity: 0 } }
  .flow { stroke-dasharray: 9 18; animation: flow 2.8s linear infinite; }
  .flow-slow { stroke-dasharray: 14 22; animation: flow 7s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -108; } }
  .ring { animation: ring 2.6s ease-in-out infinite; }
  @keyframes ring { 0%, 100% { stroke-opacity: 1 } 50% { stroke-opacity: 0.28 } }
  .orbit { transform-box: fill-box; transform-origin: center; animation: orbit 5.5s linear infinite; }
  @keyframes orbit { to { transform: rotate(360deg); } }
  .halo { transform-box: fill-box; transform-origin: center; animation: halo 2.2s ease-out infinite; }
  @keyframes halo { 0% { transform: scale(0.94); opacity: 0.75 } 80% { opacity: 0 } 100% { transform: scale(1.42); opacity: 0 } }
  .live { transform-box: fill-box; transform-origin: center; animation: beat 2.2s ease-in-out infinite; }
  @keyframes beat { 0%, 100% { transform: scale(1); opacity: 1 } 50% { transform: scale(1.45); opacity: 0.65 } }
  .traveler { offset-path: path("M40 210 C 180 120, 280 250, 460 190 S 760 120, 1060 150"); animation: travel 9s linear infinite; }
  .traveler-b { offset-path: path("M40 250 C 220 180, 340 300, 540 230 S 820 300, 1060 200"); animation: travel 12s linear infinite; }
  @keyframes travel { from { offset-distance: 0% } to { offset-distance: 100% } }
  .sheen { animation: sheen 4.2s ease-in-out infinite; }
  @keyframes sheen { 0% { transform: translateX(-140px); opacity: 0 } 18% { opacity: 0.85 } 82% { opacity: 0.85 } 100% { transform: translateX(1120px); opacity: 0 } }
</style>


<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#A855F7"/>
    <stop offset="55%" stop-color="#6DFF6A"/>
    <stop offset="100%" stop-color="#3ED0E8"/>
  </linearGradient>
  <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#07040E" stop-opacity="0"/>
    <stop offset="45%" stop-color="#3B0764"/>
    <stop offset="100%" stop-color="#5B21B6"/>
  </linearGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="textglow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>


<clipPath id="avatar"><circle cx="118" cy="168" r="58"/></clipPath>

<rect x="1.25" y="1.25" width="1097.5" height="447.5" rx="22" fill="#07040E"/>
<rect x="1.25" y="1.25" width="1097.5" height="447.5" rx="22" stroke="url(#edge)" stroke-width="1.5"/>

