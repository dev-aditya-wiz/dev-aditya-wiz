<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="100%" role="img" aria-label="Developer identity card">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#86EFAC"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="photoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="photoClip">
      <circle cx="150" cy="168" r="72"/>
    </clipPath>
  </defs>

  <rect width="980" height="460" rx="28" fill="#000000"/>
  <rect x="10" y="10" width="960" height="440" rx="22" fill="url(#cardBg)" stroke="url(#cardStroke)" stroke-width="2"/>
  <rect x="10" y="10" width="960" height="440" rx="22" fill="url(#shine)"/>

  <rect x="18" y="18" width="944" height="424" rx="18" fill="none" stroke="#2563EB" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="8 10">
    <animate attributeName="stroke-dashoffset" values="0;72" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="40" y="52" fill="#86EFAC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="4">DEV.ID // ACCESS GRANTED</text>
  <text x="940" y="52" text-anchor="end" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">v2.0</text>

  <circle cx="150" cy="168" r="92" fill="url(#photoGlow)"/>
  <circle cx="150" cy="168" r="76" fill="none" stroke="#38BDF8" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="168" r="72" fill="#050505" stroke="#86EFAC" stroke-width="1.5"/>
  <g clip-path="url(#photoClip)">
    <rect x="78" y="96" width="144" height="144" fill="#0a0a0a"/>
    <circle cx="150" cy="158" r="28" fill="#2563EB" opacity="0.85"/>
    <ellipse cx="150" cy="230" rx="46" ry="40" fill="#2563EB" opacity="0.7"/>
    <rect x="78" y="210" width="144" height="18" fill="#38BDF8" opacity="0.18">
      <animate attributeName="y" values="96;230;96" dur="3.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="150" y="268" text-anchor="middle" fill="#86EFAC" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">[YOUR PROFILE IMAGE]</text>

  <text x="280" y="118" fill="#F8FAFC" font-size="32" font-weight="700" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" filter="url(#cardGlow)">[YOUR NAME]</text>
  <text x="280" y="150" fill="#38BDF8" font-size="16" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">[YOUR TITLE]</text>
  <text x="280" y="180" fill="#F8FAFC" opacity="0.8" font-size="14" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">[YOUR TAGLINE]</text>

  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
    <rect x="280" y="200" width="640" height="1" fill="#2563EB" opacity="0.4"/>
    <text x="280" y="230" fill="#86EFAC">LOCATION</text>
    <text x="400" y="230" fill="#F8FAFC">[YOUR LOCATION]</text>
    <text x="280" y="258" fill="#86EFAC">GITHUB</text>
    <text x="400" y="258" fill="#F8FAFC">[YOUR GITHUB]</text>
    <text x="280" y="286" fill="#86EFAC">FOCUS</text>
    <text x="400" y="286" fill="#F8FAFC">[YOUR CURRENT FOCUS]</text>
    <text x="280" y="314" fill="#86EFAC">STATUS</text>
    <text x="400" y="314" fill="#F8FAFC">Learning • Building • Improving</text>
  </g>

  <g transform="translate(40, 350)">
    <rect width="900" height="78" rx="14" fill="#000000" stroke="#2563EB" stroke-opacity="0.5"/>
    <text x="24" y="28" fill="#38BDF8" font-size="11" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">TECH SIGNATURE</text>
    <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#F8FAFC">
      <rect x="24" y="42" width="70" height="24" rx="12" fill="#050505" stroke="#86EFAC"/><text x="59" y="58" text-anchor="middle">Python</text>
      <rect x="104" y="42" width="58" height="24" rx="12" fill="#050505" stroke="#2563EB"/><text x="133" y="58" text-anchor="middle">C++</text>
      <rect x="172" y="42" width="58" height="24" rx="12" fill="#050505" stroke="#38BDF8"/><text x="201" y="58" text-anchor="middle">Java</text>
      <rect x="240" y="42" width="92" height="24" rx="12" fill="#050505" stroke="#86EFAC"/><text x="286" y="58" text-anchor="middle">JavaScript</text>
      <rect x="342" y="42" width="70" height="24" rx="12" fill="#050505" stroke="#2563EB"/><text x="377" y="58" text-anchor="middle">React</text>
      <rect x="422" y="42" width="78" height="24" rx="12" fill="#050505" stroke="#38BDF8"/><text x="461" y="58" text-anchor="middle">Next.js</text>
      <rect x="510" y="42" width="78" height="24" rx="12" fill="#050505" stroke="#86EFAC"/><text x="549" y="58" text-anchor="middle">Node.js</text>
      <rect x="598" y="42" width="78" height="24" rx="12" fill="#050505" stroke="#2563EB"/><text x="637" y="58" text-anchor="middle">MongoDB</text>
      <rect x="686" y="42" width="58" height="24" rx="12" fill="#050505" stroke="#38BDF8"/><text x="715" y="58" text-anchor="middle">Git</text>
      <rect x="754" y="42" width="70" height="24" rx="12" fill="#050505" stroke="#86EFAC"/><text x="789" y="58" text-anchor="middle">Figma</text>
    </g>
  </g>
</svg>
