<text x="1060" y="48" text-anchor="end" fill="#C4B5FD" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">v1.0</text>
<circle cx="118" cy="168" r="66" fill="#083028" opacity="0.9" filter="url(#soft)"/>
<circle class="halo" cx="118" cy="168" r="62" fill="none" stroke="#3ED0E8" stroke-width="2"/>
<circle class="orbit" cx="118" cy="168" r="70" fill="none" stroke="#6DFF6A" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="10 16"/>
<circle class="ring" cx="118" cy="168" r="62" fill="none" stroke="#6DFF6A" stroke-width="2"/>
