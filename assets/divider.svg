<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="18" viewBox="0 0 1100 18" fill="none">
<style>
  .sheen { animation: sheen 4.2s ease-in-out infinite; }
  @keyframes sheen { 0% { transform: translateX(-140px); opacity: 0 } 18% { opacity: 0.85 } 82% { opacity: 0.85 } 100% { transform: translateX(1120px); opacity: 0 } }
</style>
<defs>
  <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#A855F7" stop-opacity="0"/>
    <stop offset="20%" stop-color="#A855F7"/>
    <stop offset="50%" stop-color="#6DFF6A"/>
    <stop offset="80%" stop-color="#3ED0E8"/>
    <stop offset="100%" stop-color="#3ED0E8" stop-opacity="0"/>
  </linearGradient>
  <filter id="g" x="-5%" y="-200%" width="110%" height="500%">
    <feGaussianBlur stdDeviation="2"/>
  </filter>
</defs>
<rect x="40" y="8" width="1020" height="2" rx="1" fill="url(#d)" filter="url(#g)"/>
<rect x="40" y="8" width="1020" height="2" rx="1" fill="url(#d)"/>
<rect class="sheen" x="0" y="5" width="90" height="8" rx="4" fill="#F7F7FB"/>
</svg>