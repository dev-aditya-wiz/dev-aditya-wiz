<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Animated developer terminal">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <rect width="720" height="300" rx="18" fill="#000000"/>
  <rect x="8" y="8" width="704" height="284" rx="14" fill="url(#termBg)" stroke="#2563EB" stroke-width="1.6"/>
  <rect x="8" y="8" width="704" height="36" rx="14" fill="#050505"/>
  <rect x="8" y="30" width="704" height="14" fill="#050505"/>
  <circle cx="32" cy="26" r="6" fill="#2563EB"/>
  <circle cx="52" cy="26" r="6" fill="#38BDF8"/>
  <circle cx="72" cy="26" r="6" fill="#86EFAC"/>
  <text x="360" y="30" text-anchor="middle" fill="#F8FAFC" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">~/dev - zsh</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">
    <text x="32" y="72" fill="#38BDF8">$ whoami</text>
    <text x="32" y="96" fill="#86EFAC">&gt; Aditya Kr. Sharma</text>
    <text x="32" y="128" fill="#38BDF8">$ focus</text>
    <text x="32" y="152" fill="#86EFAC">&gt; Building Strong Foundations in Software Development & Exploring AI/ML</text>
    <text x="32" y="176" fill="#22C55E">&gt; Artificial Intelligence</text>
    <text x="32" y="200" fill="#22C55E">&gt; Machine Learning</text>
    <text x="32" y="224" fill="#22C55E">&gt; Web Development</text>
    <text x="32" y="256" fill="#38BDF8">$ status</text>
    <text x="32" y="280" fill="#86EFAC">&gt; Learning | Building | Improving</text>
    <rect x="430" y="268" width="9" height="16" fill="#86EFAC">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
